name: dashboard-pages

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
      - "scripts/validate-dashboard.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4

      - name: Load latest reviewed telemetry branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin telemetry
          published_files="$(git ls-tree --name-only FETCH_HEAD | sort)"
          expected_files="$(printf '%s\n' attack-layer.json metrics.json)"
          if [[ "$published_files" != "$expected_files" ]]; then
            echo "Telemetry branch must contain only attack-layer.json and metrics.json." >&2
            printf 'Found:\n%s\n' "$published_files" >&2
            exit 1
          fi
          mkdir -p dashboard/data
          git show FETCH_HEAD:metrics.json > dashboard/data/metrics.json
          git show FETCH_HEAD:attack-layer.json > dashboard/data/attack-layer.json
          echo "Using the latest telemetry branch snapshot."

      - name: Enforce public telemetry boundary
        run: >-
          python3 scripts/validate-dashboard.py dashboard/data/metrics.json
          --layer dashboard/data/attack-layer.json
          --max-age-hours 3

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a dashboard/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
