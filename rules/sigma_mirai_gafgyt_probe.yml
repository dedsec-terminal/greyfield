title: Potential Mirai/Gafgyt Botnet Terminal Verification Echo
id: 7a82b9e1-512c-4e89-a2e6-8c4d29e31d7f
status: experimental
description: Detects command-line execution containing known botnet pseudo-terminal handshake verification strings (e.g. echo -e with hex GAYFGT signature) captured by the Greyfield Cloud Honeypot Observatory.
references:
    - https://github.com/dedsec-terminal/greyfield/blob/master/docs/THREAT_INTEL_REPORT_1700_SESSIONS.md
    - https://dedsec-terminal.github.io/greyfield/
author: Swaraj Singh (@dedsec-terminal)
date: 2026/10/14
tags:
    - attack.execution
    - attack.t1059.004
    - attack.initial_access
    - attack.t1110.001
    - attack.discovery
    - attack.t1082
logsource:
    category: process_creation
    product: linux
detection:
    selection_cmd:
        CommandLine|contains:
            - '\x47\x41\x59\x46\x47\x54'
            - 'GAYFGT'
            - 'enablelinuxshell'
            - 'linuxshell'
    condition: selection_cmd
falsepositives:
    - Legitimate administrative scripts are extremely unlikely to echo this signature.
level: high
